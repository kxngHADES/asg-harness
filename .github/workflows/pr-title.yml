# Releases are versioned from the squashed commit, whose title is the PR
# title: feat → minor, fix/perf → patch, feat! or BREAKING CHANGE → major
# (minor while below 1.0). This check keeps PR titles in that format.
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            ci
            chore
            test
            build
            revert
          requireScope: false
