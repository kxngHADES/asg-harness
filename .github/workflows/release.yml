# Autodeploy: every push to main updates a release PR (release-please).
# Merging that PR tags a version, creates the GitHub release, and the
# publish job builds binaries for every platform and attaches them.
# install.sh / install.ps1 / `asg update` always pull the latest release.
# publish-desktop builds the desktop app on each OS and attaches it too, plus
# the setup wizard as a plain file per platform (asg-setup_windows_<arch>.exe,
# asg-setup_darwin_universal.dmg, asg-setup_linux_<arch>) — never zipped.
# publish-mobile builds the Flutter mobile companion (asg-mobile_android.apk
# and asg-mobile_ios_unsigned.ipa) and attaches them with SHA-256 checksums.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Re-publish binaries for an existing tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build and upload binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-desktop:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    name: desktop (${{ matrix.os }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, os: windows, arch: "amd64 arm64" }
          - { runner: macos-latest, os: darwin, arch: universal }
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      # Ubuntu 24.04 only ships webkit2gtk-4.1; Wails needs the tag to use it.
      EXTRA_TAGS: ${{ matrix.os == 'linux' && ',webkit2_41' || '' }}
      # Wails' macOS file dialogs use UTType (macOS 11+).
      CGO_LDFLAGS: ${{ matrix.os == 'darwin' && '-framework UniformTypeIdentifiers -mmacosx-version-min=11.0' || '' }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'darwin' && '11.0' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Linux build dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test
        working-directory: desktop
        shell: bash
        run: go test -tags "desktop,production$EXTRA_TAGS" . ./installer
      - name: Build and package
        shell: bash
        run: bash desktop/build/package.sh ${{ matrix.os }} "${{ matrix.arch }}" "$TAG" dist-desktop
      - name: Attach to the release (archives, setup wizards, checksums)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist-desktop/* --clobber

  publish-mobile:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    name: mobile (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: android }
          - { runner: macos-latest, platform: ios }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test
        working-directory: mobile
        shell: bash
        run: flutter pub get && flutter analyze && flutter test
      - name: Build Android APK
        if: matrix.platform == 'android'
        working-directory: mobile
        shell: bash
        run: |
          VERSION="${TAG#v}"
          flutter build apk --release --build-name="$VERSION" --build-number="${{ github.run_number }}"
          mkdir -p ../dist-mobile
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-mobile/asg-mobile_android.apk
          (cd ../dist-mobile && sha256sum asg-mobile_android.apk > asg-mobile_android.apk.sha256)
      - name: Build iOS IPA (unsigned)
        if: matrix.platform == 'ios'
        working-directory: mobile
        shell: bash
        run: |
          VERSION="${TAG#v}"
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="${{ github.run_number }}"
          mkdir -p ../dist-mobile/Payload
          cp -R build/ios/iphoneos/Runner.app ../dist-mobile/Payload/Runner.app
          (cd ../dist-mobile && zip -qr asg-mobile_ios_unsigned.ipa Payload && rm -rf Payload && shasum -a 256 asg-mobile_ios_unsigned.ipa > asg-mobile_ios_unsigned.ipa.sha256)
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist-mobile/* --clobber
